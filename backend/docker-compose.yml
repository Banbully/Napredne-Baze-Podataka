version: "3.9"

services:

  backend:
    image: node:18
    container_name: telematics-backend
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    depends_on:
      - cassandra
      - redis
    environment:
      PORT: 3000
      CASSANDRA_HOST: cassandra
      CASSANDRA_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: vehicle_telematics
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATAMOCK_URL: https://api.datamock.dev/v1/iot-telemetry
      DATAMOCK_INTERVAL_MS: 5000

  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  cassandra_data:
  redis_data:

